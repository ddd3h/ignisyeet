#
# Build the HTML documentation (doc/) and publish it to GitHub Pages (pull requests: build only).
# Repository settings: Pages -> Build and deployment -> Source = "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # LuaLaTeX + luatexja and dvisvgm for the TikZ figures (dvisvgm needs mutool from
      # mupdf-tools to read PDF with Ghostscript >= 10.01), Inkscape for the logo,
      # IPAex / IPA / DejaVu fonts for the TikZ, matplotlib and terminal-screenshot figures.
      - name: Install TeX, fonts and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-lang-japanese texlive-latex-extra texlive-pictures \
            dvisvgm mupdf-tools inkscape \
            fonts-ipaexfont fonts-ipafont-gothic fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # Builds the release binary, regenerates the example results, figures and
      # screenshots, and runs Sphinx with -W (any warning fails the job).
      - name: Build HTML documentation
        run: make -C doc html

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: doc/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
