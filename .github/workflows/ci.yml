name: ci

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Locked wasip2 requires 1.87; clap/indexmap require 1.85, source is_none_or 1.82.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.87.0
      # rust-toolchain.toml pins the development toolchain; override it to build with the MSRV.
      - run: cargo build --locked
        env:
          RUSTUP_TOOLCHAIN: 1.87.0

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Python plot tests
        run: uv run --frozen --project python python -m unittest discover -s python
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/smoke.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          cp examples/sample_rocket.stl examples/sample_motor.eng "$scratch/"
          sed "s|^dir = .*|dir = \"$scratch/out\"|" examples/sample.toml > "$scratch/sample.toml"
          ./target/release/ignisyeet geom "$scratch/sample.toml"
          ./target/release/ignisyeet aero "$scratch/sample.toml"
          ./target/release/ignisyeet sim "$scratch/sample.toml"
          ./target/release/ignisyeet dispersion "$scratch/sample.toml"
          sed -e 's/^mode = "wind_grid".*/mode = "monte_carlo"/' \
              -e 's/^samples = .*/samples = 50/' \
              "$scratch/sample.toml" > "$scratch/monte_carlo.toml"
          ./target/release/ignisyeet dispersion "$scratch/monte_carlo.toml"
          uv run --frozen --project python python/plot.py all "$scratch/out"
          test -s "$scratch/out/plots/dispersion.png"
          test -s "$scratch/out/plots/dispersion_mc.png"
          sed -e 's/^max_time = .*/max_time = 10.0/' \
              -e "s|^dir = .*|dir = \"$scratch/incomplete\"|" \
              "$scratch/sample.toml" > "$scratch/incomplete.toml"
          status=0
          ./target/release/ignisyeet sim "$scratch/incomplete.toml" || status=$?
          if [ "$status" -ne 3 ]; then
            echo "Expected incomplete sim to exit 3, got $status" >&2
            exit 1
          fi
      - name: ShellCheck
        # Blocking: the scripts are clean; a false positive gets a "# shellcheck disable=SCxxxx" with its reason.
        run: shellcheck install.sh scripts/*.sh
