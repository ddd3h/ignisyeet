[workspace]
resolver = "2"
members = ["crates/geom", "crates/aero", "crates/panel"]

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
geom = { path = "crates/geom" }
aero = { path = "crates/aero" }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }

[profile.release]
opt-level = 3
