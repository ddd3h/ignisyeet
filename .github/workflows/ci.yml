name: ci

on: [push, pull_request]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Clippy
        # Existing geom lints fail locally with -D warnings; keep advisory until fixed.
        continue-on-error: true
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format
        continue-on-error: true # repo-wide fmt pending
        run: cargo fmt --all -- --check
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/ignisyeet geom examples/sample.toml
          ./target/release/ignisyeet aero examples/sample.toml
          ./target/release/ignisyeet sim examples/sample.toml
      - name: ShellCheck
        # Advisory until the current warnings are cleaned up.
        continue-on-error: true
        run: shellcheck install.sh scripts/*.sh
